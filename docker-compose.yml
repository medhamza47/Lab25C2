x-consul-environment: &consul-environment
  SPRING_CLOUD_CONSUL_HOST: consul
  SPRING_CLOUD_CONSUL_PORT: "8500"
  SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED: "true"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - microservices-network

  consul:
    image: hashicorp/consul:1.20.5
    command: agent -dev -client=0.0.0.0
    ports:
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - microservices-network

  gateway-service:
    build: ./gatewayService
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      consul:
        condition: service_healthy
    environment: *consul-environment
    networks:
      - microservices-network

  client-service:
    build: ./clientService
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      <<: *consul-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Micro_ClientDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    networks:
      - microservices-network

  voiture-service:
    build: ./voitureService
    ports:
      - "127.0.0.1:8089:8089"
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      <<: *consul-environment
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Micro_VoitureDB?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    networks:
      - microservices-network

  phpmyadmin:
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  mysql-data:
